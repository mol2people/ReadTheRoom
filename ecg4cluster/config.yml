paper_speed_mm_s: 25.0
gain_mm_mV: 10.0
resample_size: 3000
batch_size: 2
target_samples: 5000
seed: 42
image_extensions: [".jpg"]

metadata_regex: '^(?:DII|DIII)_(?P<participant>[^_]+)_(?:(?P<experiment>eI|eII)_)?(?P<scan_index>\d+)\.[^.]+$'
experiment_order: ["eI", "eII"]

profiles:
  tamir_adelya:
    filename_regex: '_(?:tamir|adelya)_'
    layout_file: 'layouts/tamir_12x1.yml'
    preferred_leads: ["V6", "III"]

  azamat_aygul:
    filename_regex: '_(?:azamat|aygul)_'
    layout_file: 'layouts/azamat_3x1.yml'
    preferred_leads: ["II", "V5"]
